name: Cyber Protocol — Debug Preview APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-preview.yml"
      - "app/**"
      - "gradle/**"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: cyber-protocol-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  debug-preview:
    name: Build and smoke-test Debug Preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Validate package and prepare preview artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SOURCE_APK")
          ACTUAL_PACKAGE=$(echo "$BADGING" | awk -F"'" '/^package:/ {print $2; exit}')
          ACTUAL_VERSION_CODE=$(printf '%s\\n' "$BADGING" | grep -oE "versionCode='[0-9]+'" | head -n 1 | cut -d "'" -f 2)

          echo "Detected package: $ACTUAL_PACKAGE"
          echo "Detected version code: $ACTUAL_VERSION_CODE"
          test "$ACTUAL_PACKAGE" = "com.zeroday.cyberprotocol"
          test "$ACTUAL_VERSION_CODE" = "6"

          mkdir -p preview_apk
          cp "$SOURCE_APK" preview_apk/cyber-protocol-preview.apk
          APK_SHA256=$(sha256sum preview_apk/cyber-protocol-preview.apk | awk '{print $1}')
          echo "$APK_SHA256  cyber-protocol-preview.apk" > preview_apk/cyber-protocol-preview.apk.sha256

          echo "Build class: DEBUG PREVIEW (not a final release)" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: $ACTUAL_PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $ACTUAL_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install and smoke-test the exact Debug APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb uninstall com.zeroday.cyberprotocol >/dev/null 2>&1 || true
            adb install preview_apk/cyber-protocol-preview.apk
            adb shell pm path com.zeroday.cyberprotocol
            adb shell am force-stop com.zeroday.cyberprotocol
            adb shell monkey -p com.zeroday.cyberprotocol -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.zeroday.cyberprotocol
            echo "DEBUG PREVIEW STATUS: INSTALLED AND LAUNCHED."

      - name: Upload tested Debug Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: cyber-protocol-debug-preview
          path: |
            preview_apk/cyber-protocol-preview.apk
            preview_apk/cyber-protocol-preview.apk.sha256
          if-no-files-found: error
          retention-days: 14
